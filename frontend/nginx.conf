server {
    listen 80;

    location /api/ {
        # `api` is resolved once, at nginx startup. After the api container is recreated
        # (e.g. `docker compose up --build api`) it has a new IP and this proxy returns 502
        # until nginx restarts: `docker compose restart frontend`.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: deliver events as they arrive, keep idle streams open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
