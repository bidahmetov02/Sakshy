[project]
name = "backend"
version = "0.1.0"
description = "Sakshy backend: API, worker and target-site emulator"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic",
    "asyncpg",
    "email-validator>=2.3.0",
    "fastapi",
    "httpx2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic",
    "pydantic-settings",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Not a distributable package: the top-level packages (core, api, worker,
# emulator) are imported from this directory.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "worker", "emulator", "migrations", "tests"]

[tool.pyright]
include = ["core", "api", "worker", "emulator", "migrations", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

# Generated revisions come out lint-clean: drop unused imports, then format.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix-only REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
